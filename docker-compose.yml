services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  master:
    build: .
    command: ["master"]
    environment:
      REDIS_URL: redis://redis:6379
      SELF_URL: http://master:3000
    ports:
      - "3000:3000"
    volumes:
      # gives master access to the docker socket so it can launch new
      # secondary containers on demand (from the UI's "Add secondary"
      # button) — note this is effectively root on the host.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis

  secondary:
    build: .
    command: ["secondary"]
    environment:
      REDIS_URL: redis://redis:6379
      MASTER_URL: http://master:3000
      PORT: 4000
    labels:
      app.role: secondary
    depends_on:
      - redis
      - master

  ui:
    build:
      context: ./ui
      args:
        VITE_MASTER_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - master
